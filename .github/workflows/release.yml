name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6

      # 增量更新的 runtime 复用基准：依赖未变时必须复用上一版 release 的
      # runtime zip 原文件（CI 重打会改变内容哈希，令全部老用户重下 runtime）。
      # 上一版没有 manifest 资产（首次分包发布）时静默跳过；有 manifest 但
      # runtime zip 下载失败则让任务失败，避免静默重打。
      - name: Fetch previous release runtime for reuse
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dist\windows\prev | Out-Null
          $assets = gh release view --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release found; building runtime fresh.'; exit 0 }
          if (-not ($assets -contains 'KaraokeStudio-windows.json')) { Write-Host 'Previous release has no manifest; building runtime fresh.'; exit 0 }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'KaraokeStudio-windows.json' --dir dist\windows\prev
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to download previous manifest.'; exit 1 }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'KaraokeStudio-windows-runtime.zip' --dir dist\windows\prev
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to download previous runtime zip.'; exit 1 }
          Write-Host 'Previous manifest + runtime zip ready for reuse check.'

      - name: Build Windows package
        shell: cmd
        env:
          CI: "1"
        run: scripts\build_windows.bat

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-windows
          path: |
            dist/windows/KaraokeStudio-windows.zip
            dist/windows/KaraokeStudio-windows.zip.sha256
            dist/windows/KaraokeStudio-windows.json
            dist/windows/KaraokeStudio-windows-app.zip
            dist/windows/KaraokeStudio-windows-app.zip.sha256
            dist/windows/KaraokeStudio-windows-runtime.zip
            dist/windows/KaraokeStudio-windows-runtime.zip.sha256

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6

      - name: Build macOS package
        run: bash ./scripts/build_macos.command

      - name: Archive macOS package
        run: |
          cd dist/macos
          ditto -c -k --sequesterRsrc --keepParent "Lin-K Lyrics.app" "../../KaraokeStudio-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-macos
          path: KaraokeStudio-macos.zip

  release:
    name: Publish Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Chinese release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release.py notes "$version" --output release-notes.md

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-windows
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-macos
          path: release-assets/macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release-assets/windows/KaraokeStudio-windows.zip
            release-assets/windows/KaraokeStudio-windows.zip.sha256
            release-assets/windows/KaraokeStudio-windows.json
            release-assets/windows/KaraokeStudio-windows-app.zip
            release-assets/windows/KaraokeStudio-windows-app.zip.sha256
            release-assets/windows/KaraokeStudio-windows-runtime.zip
            release-assets/windows/KaraokeStudio-windows-runtime.zip.sha256
            release-assets/macos/KaraokeStudio-macos.zip
