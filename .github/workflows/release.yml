name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: '恢复发布的现有标签；留空只构建当前提交'
        type: string
        default: ''
      reuse_windows_run_id:
        description: '复用同一提交的 Windows 产物所在运行 ID；留空重新构建'
        type: string
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify reusable Windows build
        if: inputs.reuse_windows_run_id != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.reuse_windows_run_id }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') { throw 'Invalid source run ID.' }
          $sourceRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source run.' }
          $sourceSha = git rev-parse HEAD
          if ($sourceRun.status -ne 'completed' -or $sourceRun.head_sha -ne $sourceSha) {
            throw 'Reusable Windows artifacts must come from a completed run of the exact same commit.'
          }

      - name: Reuse Windows artifact
        if: inputs.reuse_windows_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-windows
          path: dist/windows
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_windows_run_id }}

      - name: Setup Python
        if: inputs.reuse_windows_run_id == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 本身无代码引用（宿主/SUG 均不 import，build_windows.bat 也
      # --exclude-module PySide6，装不装都不进包），但 build_parts 的 runtime
      # 复用闸对构建环境 pip freeze 计指纹且 FREEZE_EXCLUDES 未排除它，
      # 历版 freeze_hash 都含 PySide6——现在移除会让下个版本指纹必翻转、
      # runtime 必重打，全量更新用户多下一次 runtime zip。等某次发版本就
      # 要改 runtime 内容（依赖真变/收集规则调整）时顺带移除。
      - name: Install dependencies
        if: inputs.reuse_windows_run_id == ''
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6

      # 增量更新的 runtime 复用基准：依赖未变时必须复用上一版 release 的
      # runtime zip 原文件（CI 重打会改变内容哈希，令全部老用户重下 runtime）。
      # 上一版没有 manifest 资产（首次分包发布）时静默跳过；有 manifest 但
      # runtime zip 下载失败则让任务失败，避免静默重打。
      - name: Fetch previous release runtime for reuse
        if: inputs.reuse_windows_run_id == ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dist\windows\prev | Out-Null
          $assets = gh release view --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release found; building runtime fresh.'; exit 0 }
          if (-not ($assets -contains 'KaraokeStudio-windows.json')) { Write-Host 'Previous release has no manifest; building runtime fresh.'; exit 0 }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'KaraokeStudio-windows.json' --dir dist\windows\prev
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to download previous manifest.'; exit 1 }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'KaraokeStudio-windows-runtime.zip' --dir dist\windows\prev
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to download previous runtime zip.'; exit 1 }
          Write-Host 'Previous manifest + runtime zip ready for reuse check.'

      # Skia sidecar（4.5.0 起随包）：依赖与 LLVM 按锁文件缓存。
      - name: Cache Skia dependencies
        if: inputs.reuse_windows_run_id == ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/krok-helper/skia-deps
          key: skia-m150-windows-x64-${{ hashFiles('native/subtitle_renderer/skia.lock.json', 'scripts/skia_build/configuration.py') }}

      # Skia 用锁定的 clang-cl 21 编译，但用 MSVC 的 STL 头：14.52 起 STL 要求 Clang 22，
      # 因此构建机必须用 14.50 LTS 工具集（用户只需随包的 VC++ 运行时）。runner 没有时
      # 安装 v14.50 并列组件；只有同为 14.50 的服务版本时显式改用它，并记录进构建指纹。
      - name: Select MSVC toolset and Windows SDK for Skia
        if: inputs.reuse_windows_run_id == ''
        shell: powershell
        run: |
          $lock = Get-Content native/subtitle_renderer/skia.lock.json -Raw | ConvertFrom-Json
          $spec = $lock.toolchains.'windows-x64'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $roots = & $vswhere -all -products * -property installationPath
          $versions = @(foreach ($root in $roots) { Get-ChildItem "$root\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | ForEach-Object Name })
          Write-Host "Installed MSVC toolsets: $($versions -join ', ')"
          if (-not ($versions | Where-Object { $_ -like '14.50.*' })) {
            $installPath = & $vswhere -latest -property installationPath
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            Write-Host "Installing MSVC v14.50 build tools into $installPath ..."
            $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$installPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64',
              '--quiet', '--norestart', '--nocache')
            Write-Host "vs_installer exit code: $($process.ExitCode)"
            $versions = @(foreach ($root in $roots) { Get-ChildItem "$root\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | ForEach-Object Name })
            Write-Host "MSVC toolsets after install: $($versions -join ', ')"
          }
          if ($versions -notcontains $spec.msvc) {
            $candidate = $versions | Where-Object { $_ -like '14.50.*' } | Sort-Object { [version]$_ } | Select-Object -Last 1
            if (-not $candidate) { throw "MSVC 14.50 toolset is not available on this runner." }
            "KROK_SKIA_MSVC_VERSION=$candidate" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "::warning::Pinned MSVC $($spec.msvc) missing; building Skia with $candidate"
          }
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $sdks = @(Get-ChildItem $kits -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } | ForEach-Object Name)
          Write-Host "Installed Windows SDKs: $($sdks -join ', ')"
          if ($sdks -notcontains $spec.sdk) {
            $sdk = $sdks | Sort-Object { [version]$_ } | Select-Object -Last 1
            "KROK_SKIA_WINDOWS_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "::warning::Pinned Windows SDK $($spec.sdk) missing; building Skia with $sdk"
          }

      - name: Build Windows package
        if: inputs.reuse_windows_run_id == ''
        shell: cmd
        env:
          CI: "1"
        run: scripts\build_windows.bat

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-windows
          path: |
            dist/windows/KaraokeStudio-windows.zip
            dist/windows/KaraokeStudio-windows.zip.sha256
            dist/windows/KaraokeStudio-windows.json
            dist/windows/KaraokeStudio-windows-app.zip
            dist/windows/KaraokeStudio-windows-app.zip.sha256
            dist/windows/KaraokeStudio-windows-runtime.zip
            dist/windows/KaraokeStudio-windows-runtime.zip.sha256

  build-macos:
    name: Build macOS
    # Keep Apple Silicon while avoiding the macOS 26 runner allocation failures.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Configure macOS auto-update
        env:
          KROK_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          KROK_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from krok_helper.updater.macos_metadata import validate_ed_key
          public = os.environ.get("KROK_SPARKLE_PUBLIC_ED_KEY", "").strip()
          private = os.environ.get("KROK_SPARKLE_PRIVATE_ED_KEY", "").strip()
          if public and private:
              public = validate_ed_key(public)
          else:
              public = ""
              print("::notice::Sparkle keys are incomplete; publishing a manual-only macOS package.")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"KROK_SPARKLE_PUBLIC_ED_KEY={public}\n")
          PY

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller cryptography cmake "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@bbfb1f7c0590b9eb3fa91356e75bb64fb15d3643"

      - name: Cache Qt SDK for the Skia sidecar
        uses: actions/cache@v4
        with:
          path: ~/qt-krok
          key: qt-6.11.0-macos-qtbase-qtdeclarative-v1

      - name: Install Qt 6.11.0 SDK for the Skia sidecar
        run: |
          if [ ! -f ~/qt-krok/6.11.0/macos/lib/cmake/Qt6Quick/Qt6QuickConfig.cmake ]; then
            python3 -m aqt install-qt mac desktop 6.11.0 clang_64 --archives qtbase qtdeclarative --outputdir ~/qt-krok
          fi

      - name: Cache Skia dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/krok-helper/skia-deps
          key: skia-m150-macos-arm64-${{ hashFiles('native/subtitle_renderer/skia.lock.json', 'scripts/skia_build/configuration.py') }}

      - name: Build macOS package
        env:
          # skia.lock.json pins the Xcode used for the Skia sidecar.
          DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
        run: bash ./scripts/build_macos.command

      - name: Archive macOS package
        run: |
          cd dist/macos
          ditto -c -k --sequesterRsrc --keepParent "Lin-K Lyrics.app" "../../KaraokeStudio-macos.zip"

      - name: Sign macOS update archive and generate appcast
        if: env.KROK_SPARKLE_PUBLIC_ED_KEY != ''
        env:
          KROK_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: python3 scripts/build_macos_appcast.py KaraokeStudio-macos.zip --sdk-dir build/sparkle-2.9.6

      - name: Build and verify macOS direct deltas
        if: env.KROK_SPARKLE_PUBLIC_ED_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KROK_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: python3 scripts/build_macos_deltas.py KaraokeStudio-macos.zip --sdk-dir build/sparkle-2.9.6 --app "dist/macos/Lin-K Lyrics.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-macos
          path: |
            KaraokeStudio-macos.zip
            KaraokeStudio-macos-appcast.xml
            KaraokeStudio-macos-deltas.zip

  build-linux:
    name: Build Linux
    # Oldest supported glibc (2.35); the package runs on this release or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # clang 21.1.8 is pinned by skia.lock.json; GCC 12's libstdc++ provides
      # C++20 while matching the runtime Ubuntu 22.04 already ships.
      # Qt6Gui/GuiPrivate's CMake packages (Skia sidecar) need the OpenGL, EGL, XKB and
      # Vulkan development files.
      - name: Install build toolchain and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 ninja-build libportaudio2 libasound2 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libvulkan1 \
            libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21
          clang++-21 --version

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller cmake "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@bbfb1f7c0590b9eb3fa91356e75bb64fb15d3643"

      - name: Cache Qt SDK for the Skia sidecar
        uses: actions/cache@v4
        with:
          path: ~/qt-krok
          key: qt-6.11.0-linux-qtbase-qtdeclarative-v1

      - name: Install Qt 6.11.0 SDK for the Skia sidecar
        run: |
          if [ ! -f ~/qt-krok/6.11.0/gcc_64/lib/cmake/Qt6Quick/Qt6QuickConfig.cmake ]; then
            python3 -m aqt install-qt linux desktop 6.11.0 linux_gcc_64 --archives qtbase qtdeclarative --outputdir ~/qt-krok
          fi

      - name: Cache Skia dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/krok-helper/skia-deps
          key: skia-m150-linux-x64-${{ hashFiles('native/subtitle_renderer/skia.lock.json', 'scripts/skia_build/configuration.py') }}

      - name: Build Linux package
        env:
          CI: "1"
        run: bash ./scripts/build_linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-linux
          path: |
            dist/KaraokeStudio-linux.zip
            dist/KaraokeStudio-linux.zip.sha256

  release:
    name: Publish Release
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Generate Chinese release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release.py notes "$version" --output release-notes.md

      # 自 4.4.0 起（首个无旧名副本版本）的 release body 必须带「手动下载完整包」
      # 提示，仍在双名分发（4.3.x 及更早）的版本不得带。防止发布流程改动（如更换
      # body 来源）让提示与包内容错位；口径与 scripts/release.py / build_parts.py 同源。
      - name: Verify manual-update notice policy
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release.py check-notes "$version" release-notes.md

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-windows
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-macos
          path: release-assets/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KaraokeStudio-linux
          path: release-assets/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/windows/KaraokeStudio-windows.zip
            release-assets/windows/KaraokeStudio-windows.zip.sha256
            release-assets/windows/KaraokeStudio-windows.json
            release-assets/windows/KaraokeStudio-windows-app.zip
            release-assets/windows/KaraokeStudio-windows-app.zip.sha256
            release-assets/windows/KaraokeStudio-windows-runtime.zip
            release-assets/windows/KaraokeStudio-windows-runtime.zip.sha256
            release-assets/macos/KaraokeStudio-macos.zip
            release-assets/macos/KaraokeStudio-macos-appcast.xml
            release-assets/macos/KaraokeStudio-macos-deltas.zip
            release-assets/linux/KaraokeStudio-linux.zip
            release-assets/linux/KaraokeStudio-linux.zip.sha256
