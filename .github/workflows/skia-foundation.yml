name: Skia native foundation

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Rebuild all Skia dependency objects
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build and preview test tools
        # PyQt6 must match the Qt SDK exactly; aqtinstall is pinned to a commit that reads Qt 6.11.
        run: >
          python -m pip install cmake pytest numpy fonttools charset-normalizer PyQt6-Fluent-Widgets imageio-ffmpeg==0.6.0 PyQt6==6.11.0 PyQt6-Qt6==6.11.0
          "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@bbfb1f7c0590b9eb3fa91356e75bb64fb15d3643"
      - uses: actions/cache@v4
        with:
          path: ~/qt-krok
          key: qt-6.11.0-macos-qtbase-qtdeclarative-v1
      - name: Install Qt 6.11.0 SDK for the Quick preview module
        run: |
          if [ ! -f ~/qt-krok/6.11.0/macos/lib/cmake/Qt6Quick/Qt6QuickConfig.cmake ]; then
            python -m aqt install-qt mac desktop 6.11.0 clang_64 --archives qtbase qtdeclarative --outputdir ~/qt-krok
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/krok-helper/skia-deps
          key: skia-m150-macos-${{ matrix.arch }}-${{ hashFiles('native/subtitle_renderer/skia.lock.json', 'scripts/skia_build/configuration.py') }}
      - name: Build native Metal and Raster
        env:
          CLEAN_ARG: ${{ inputs.clean && '--clean' || '' }}
        run: |
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --gpu-api metal $CLEAN_ARG --jobs 3 --qt-root ~/qt-krok/6.11.0/macos
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --gpu-api metal --jobs 3 --qt-root ~/qt-krok/6.11.0/macos
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --cpu-only $CLEAN_ARG --jobs 3 --qt-root ~/qt-krok/6.11.0/macos --smoke-font /System/Library/Fonts/Supplemental/Arial.ttf
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --cpu-only --jobs 3 --qt-root ~/qt-krok/6.11.0/macos --smoke-font /System/Library/Fonts/Supplemental/Arial.ttf
      - name: Record hosted Metal capability honestly
        shell: bash
        run: |
          dir="$HOME/.cache/krok-helper/skia-deps/native/macos-${{ matrix.arch }}-metal"
          "$dir/krok_skia_raster_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/raster"
          set +e
          "$dir/krok_skia_gpu_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/metal" --require-hardware > "$dir/metal-attempt.log" 2>&1
          status=$?
          echo "$status" > "$dir/metal-attempt.exitcode"
          cat "$dir/metal-attempt.log"
          if [ "$status" -ne 0 ]; then
            echo '::warning::Native build and Raster passed; hosted Metal hardware smoke did not pass. Hardware gate remains open.'
            "$dir/krok_skia_gpu_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/metal-virtual" > "$dir/metal-virtual-attempt.log" 2>&1
            virtual_status=$?
            echo "$virtual_status" > "$dir/metal-virtual-attempt.exitcode"
            cat "$dir/metal-virtual-attempt.log"
          fi
          "$dir/subtitle_skia_backend_tests" --gpu --allow-software > "$dir/owner-backend.log" 2>&1
          owner_status=$?
          echo "$owner_status" > "$dir/owner-backend.exitcode"
          cat "$dir/owner-backend.log"
          if { [ "$status" -eq 0 ] || [ "${virtual_status:-1}" -eq 0 ]; } && [ "$owner_status" -ne 0 ]; then
            exit "$owner_status"
          fi
      - name: Quick preview on the hosted Mac (Metal scene graph, real window)
        env:
          KROK_SKIA_NATIVE_TEST_ARCH: ${{ matrix.arch }}
          KROK_SKIA_NATIVE_TEST_FONT: /System/Library/Fonts/Supplemental/Arial.ttf
          KROK_METAL_VALIDATION: '1'
        run: |
          export KROK_SKIA_NATIVE_TEST_ROOT="$HOME/.cache/krok-helper/skia-deps/native"
          # The app's conftest imports the whole application; these tests need only PyQt6.
          mkdir -p build
          python -m pytest --noconftest tests/test_subtitle_skia_preview.py tests/test_subtitle_skia_preview_lifecycle.py -rs -v --basetemp build/skia-preview-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-macos-${{ matrix.arch }}-evidence
          path: |
            ~/.cache/krok-helper/skia-deps/native/**/build-fingerprint.json
            ~/.cache/krok-helper/skia-deps/native/**/*.json
            ~/.cache/krok-helper/skia-deps/native/**/*.rgba
            ~/.cache/krok-helper/skia-deps/native/**/*.png
            ~/.cache/krok-helper/skia-deps/native/**/*.log
            ~/.cache/krok-helper/skia-deps/native/**/*.exitcode
            build/skia-preview-tests/**/lifecycle.*.log
      - name: Product IR, G5 preview and short MP4 (hosted Metal device)
        env:
          KROK_SUBTITLE_SKIA_REQUIRE_HARDWARE: '0'
        run: |
          export KROK_TEST_SKIA_SIDECAR="$HOME/.cache/krok-helper/skia-deps/native/macos-${{ matrix.arch }}-metal/krok_skia_subtitle_renderer"
          python -m pytest --noconftest tests/test_subtitle_skia_protocol.py tests/test_subtitle_skia_text.py -rs -v --basetemp build/skia-protocol-tests --junitxml build/skia-protocol.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-protocol-${{ matrix.arch }}-evidence
          path: |
            build/skia-protocol.xml
            build/skia-protocol-tests/**
      - name: Package the Mac validation bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          arch = os.environ["ARCH"]
          native = Path.home() / ".cache/krok-helper/skia-deps/native"
          keep = {"metal": ["krok_skia_gpu_smoke", "krok_skia_raster_smoke", "subtitle_skia_backend_tests", "krok_skia_subtitle_renderer",
                            "krok_metal_validation_probe",
                            "libsubtitle_skia_preview_test_control.dylib",
                            "build-fingerprint.json", ".cmake/api/v1/reply", "qml"],
                  "raster": ["krok_skia_raster_smoke", "subtitle_skia_backend_tests", "krok_skia_subtitle_renderer",
                             "build-fingerprint.json", ".cmake/api/v1/reply"]}
          files = []
          for api, names in keep.items():
              base = native / f"macos-{arch}-{api}"
              for name in names:
                  path = base / name
                  files += sorted(p for p in path.rglob("*") if p.is_file()) if path.is_dir() else [path]
          manifest = {"commit": os.environ["GITHUB_SHA"], "arch": arch, "run_id": os.environ["GITHUB_RUN_ID"],
                      "text_metrics_schema": 1,
                      "files": {f"native/{p.relative_to(native).as_posix()}": hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in files}}
          out = Path(os.environ["RUNNER_TEMP"]) / f"mac-validation-{arch}.tar.gz"
          with tarfile.open(out, "w:gz") as bundle:
              for path in files:  # tar keeps the executable bits that artifact zips drop
                  bundle.add(path, f"native/{path.relative_to(native).as_posix()}")
              manifest_path = Path(os.environ["RUNNER_TEMP"]) / "manifest.json"
              manifest_path.write_text(json.dumps(manifest, indent=2))
              bundle.add(manifest_path, "manifest.json")
          print(out, len(files), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mac-validation-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-validation-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  bundle-check:
    # A fresh Mac with no Qt SDK and no build cache, like the machine that will run the bundle.
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: mac-validation-${{ matrix.arch }}
          path: downloaded
      - name: One-command hardware check (hosted Metal is virtual, so only the hardware gate may fail)
        run: python scripts/mac_hardware_check.py downloaded/mac-validation-${{ matrix.arch }}.tar.gz --allow-virtual-gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-hardware-check-${{ matrix.arch }}-results
          path: build/mac-hardware-check-results.zip

  text-metrics-compare:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: skia-protocol-*-evidence
          path: metrics-artifacts
      - name: Compare identical-font ARM64 and x64 metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys
          paths = sorted(Path('metrics-artifacts').rglob('canonical-metrics.json'))
          assert len(paths) == 2, paths
          subprocess.run([sys.executable, 'scripts/compare_skia_text_metrics.py', *map(str, paths)], check=True)
          PY
