name: Skia native foundation

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Rebuild all Skia dependency objects
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install cmake
      - uses: actions/cache@v4
        with:
          path: ~/.cache/krok-helper/skia-deps
          key: skia-m150-macos-${{ matrix.arch }}-${{ hashFiles('native/subtitle_renderer/skia.lock.json', 'scripts/skia_build/configuration.py') }}
      - name: Build native Metal and Raster
        env:
          CLEAN_ARG: ${{ inputs.clean && '--clean' || '' }}
        run: |
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --gpu-api metal $CLEAN_ARG --jobs 3
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --gpu-api metal --jobs 3
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --cpu-only $CLEAN_ARG --jobs 3 --smoke-font /System/Library/Fonts/Supplemental/Arial.ttf
          python scripts/build_skia_renderer.py --platform macos --arch ${{ matrix.arch }} --cpu-only --jobs 3 --smoke-font /System/Library/Fonts/Supplemental/Arial.ttf
      - name: Record hosted Metal capability honestly
        shell: bash
        run: |
          dir="$HOME/.cache/krok-helper/skia-deps/native/macos-${{ matrix.arch }}-metal"
          "$dir/krok_skia_raster_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/raster"
          set +e
          "$dir/krok_skia_gpu_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/metal" --require-hardware > "$dir/metal-attempt.log" 2>&1
          status=$?
          echo "$status" > "$dir/metal-attempt.exitcode"
          cat "$dir/metal-attempt.log"
          if [ "$status" -ne 0 ]; then
            echo '::warning::Native build and Raster passed; hosted Metal hardware smoke did not pass. Hardware gate remains open.'
            "$dir/krok_skia_gpu_smoke" /System/Library/Fonts/Supplemental/Arial.ttf "$dir/metal-virtual" > "$dir/metal-virtual-attempt.log" 2>&1
            virtual_status=$?
            echo "$virtual_status" > "$dir/metal-virtual-attempt.exitcode"
            cat "$dir/metal-virtual-attempt.log"
          fi
          "$dir/subtitle_skia_backend_tests" --gpu --allow-software > "$dir/owner-backend.log" 2>&1
          owner_status=$?
          echo "$owner_status" > "$dir/owner-backend.exitcode"
          cat "$dir/owner-backend.log"
          if { [ "$status" -eq 0 ] || [ "${virtual_status:-1}" -eq 0 ]; } && [ "$owner_status" -ne 0 ]; then
            exit "$owner_status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skia-macos-${{ matrix.arch }}-evidence
          path: |
            ~/.cache/krok-helper/skia-deps/native/**/build-fingerprint.json
            ~/.cache/krok-helper/skia-deps/native/**/*.json
            ~/.cache/krok-helper/skia-deps/native/**/*.rgba
            ~/.cache/krok-helper/skia-deps/native/**/*.png
            ~/.cache/krok-helper/skia-deps/native/**/*.log
            ~/.cache/krok-helper/skia-deps/native/**/*.exitcode
